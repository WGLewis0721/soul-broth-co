<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Haus of Micah Section 04 — Color Direction</title>
<desc id="desc">Forest pine green 60%, warm ivory 30%, honey amber 5%, clay 5%, plus dark leaf green.</desc>
<rect width="1200" height="600" fill="#F7F2E7"/>
<text x="60" y="79" font-family="Georgia,serif" font-size="52" fill="#0B3528">The Haus Table</text>
<text x="60" y="112" font-family="Arial,sans-serif" font-size="14" letter-spacing="3" fill="#9D5739">HAUS OF MICAH  /  COLOR DIRECTION V5</text>
<text x="60" y="165" font-family="Arial,sans-serif" font-size="19" fill="#144A35">Green-led, ingredient-warm, editorial. The color frames the food; it never competes.</text>
